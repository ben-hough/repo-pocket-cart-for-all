[config]
schemaVersion = "0.0.1"

[package]
namespace = "MrGlim"
name = "PocketCartForAll"
versionNumber = "1.0.0"
description = "Shares PocketCartPlus's Keep Items upgrade with the whole lobby: once anyone consumes it (or always), every player can pocket the POCKET C.A.R.T. with its items. Host-controlled."
websiteUrl = "https://github.com/ben-hough/repo-pocket-cart-for-all"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack = "5.4.2305"
darmuh-PocketCartPlus = "0.6.1"

[build]
iconPath = "icon.png"
readmePath = "README.md"
outdir = "../build-PocketCartForAll"

[[build.copy]]
source = "MrGlim.PocketCartForAll.dll"
target = "MrGlim.PocketCartForAll.dll"

[[build.copy]]
source = "CHANGELOG.md"
target = "CHANGELOG.md"

[publish]
repository = "https://thunderstore.io"
communities = ["repo"]

[publish.categories]
repo = ["mods", "upgrades", "quality-of-life", "ai-generated"]
